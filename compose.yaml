services:
  mysql:
    image: 'mysql:8.4'
    container_name: scboard-mysql-dev
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scboard}
      MYSQL_USER: ${MYSQL_USER:-scboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-password}
    ports:
      - '3306:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
