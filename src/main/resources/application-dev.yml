spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:scboard}
    username: ${MYSQL_USER:scboard}
    password: ${MYSQL_PASSWORD:dev-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      enabled: true
      file: compose.yaml
      # 공유 개발 DB는 애플리케이션 종료 시 중지하지 않는다.
      lifecycle-management: start-only
  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug
