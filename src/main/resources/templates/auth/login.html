<!-- 로그인 화면 -->
<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>로그인 · SCBoard</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <div class="container">
    <div class="card form-narrow">
      <h1>로그인</h1>
      
      <div class="alert alert-ok" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인하세요.</div>
      
      <div class="alert alert-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
      
      <form th:action="@{/login}" method="post">
        <div class="form-row">
          <label for="username">아이디</label>
          <input type="text" id="username" name="username" autofocus/>
        </div>
        <div class="form-row">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password"/>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">로그인</button>
        </div>
      </form>
      <div class="oauth-login" th:if="${oauthLoginAvailable}">
        <span>or</span>
        <a class="btn oauth-google" th:href="@{/oauth2/authorization/google}">Google로 계속하기</a>
      </div>
      <p class="form-foot">계정이 없나요? <a th:href="@{/signup}">회원가입</a></p>
    </div>
  </div>
</main>
</body>
</html>
