<!-- 회원가입 화면 -->
<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>회원가입 · SCBoard</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <div class="container">
    <div class="card form-narrow">
      <h1>회원가입</h1>
      <form th:action="@{/signup}" th:object="${signupForm}" method="post">
        <div class="form-row">
          <label for="username">아이디</label>
          <input type="text" id="username" th:field="*{username}" placeholder="4~20자"/>
          <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="form-row">
          <label for="password">비밀번호</label>
          <input type="password" id="password" th:field="*{password}" placeholder="4자 이상"/>
          <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="form-row">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" th:field="*{nickname}"/>
          <div class="field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">가입하기</button>
        </div>
      </form>
      <div class="oauth-login" th:if="${oauthLoginAvailable}">
        <a class="btn oauth-google" th:href="@{/oauth2/authorization/google}">Google로 회원가입</a>
      </div>
      <p class="form-foot">이미 계정이 있나요? <a th:href="@{/login}">로그인</a></p>
    </div>
  </div>
</main>
</body>
</html>
