<!-- 오류를 보여주는 화면 -->
<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>오류 · SCBoard</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <script th:src="@{/js/fragment-loader.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <div class="container">
    <div class="card form-narrow" style="text-align:center;">
      
      <h1 th:text="${status} ?: '오류'">오류</h1>
      <p style="color:#6b7684;" th:text="${error}">문제가 발생했습니다.</p>
      <p th:if="${message}" th:text="${message}"></p>
      <a th:href="@{/posts}" class="btn btn-primary" style="margin-top:12px;">게시판으로</a>
    </div>
  </div>
</main>
</body>
</html>
